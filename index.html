<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEESHO A+ LISTING AUTOMATION PRO — Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="loginView" class="center-screen">
      <div class="card login-card">
        <div class="brand">MEESHO A+<span>LISTING AUTOMATION PRO</span></div>
        <h1>Admin Panel</h1>
        <p class="muted">Sign in with the authorized Google account.</p>
        <button id="googleLogin" class="primary">Continue with Google</button>
        <p id="loginError" class="error"></p>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <header class="topbar">
        <div>
          <div class="brand compact">MEESHO A+<span>LISTING AUTOMATION PRO</span></div>
          <div class="muted small">Administration</div>
        </div>
        <div class="top-actions">
          <span id="adminEmail"></span>
          <button id="logout" class="ghost">Logout</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <button class="nav active" data-section="dashboard">Dashboard</button>
          <button class="nav" data-section="users">Users</button>
          <button class="nav" data-section="plans">Plans</button>
          <button class="nav" data-section="promoCodes">Promo Codes</button>
          <button class="nav" data-section="payments">Payments</button>
          <button class="nav" data-section="memberships">Memberships</button>
          <button class="nav" data-section="devices">Devices</button>
          <button class="nav" data-section="settings">Settings</button>
        </aside>

        <section class="content">
          <div id="dashboard" class="section"></div>
          <div id="users" class="section hidden"></div>
          <div id="plans" class="section hidden"></div>
          <div id="promoCodes" class="section hidden"></div>
          <div id="payments" class="section hidden"></div>
          <div id="memberships" class="section hidden"></div>
          <div id="devices" class="section hidden"></div>
          <div id="settings" class="section hidden"></div>
        </section>
      </main>
    </section>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
